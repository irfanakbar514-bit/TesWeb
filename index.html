          <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <script>
        /* --- 1. INISIALISASI DATA & VARIABEL --- */
        const weddingDate = new Date("Aug 15, 2026 08:00:00").getTime();
        const urlParams = new URLSearchParams(window.location.search);
        const tamu = urlParams.get('to') || "Tamu Undangan";
        
        // Set Nama Tamu di Cover
        document.getElementById('guestName').innerText = tamu;

        /* --- 2. SISTEM ANTI-ZOOM & LOCK SCREEN --- */
        // Mencegah zoom cubit (pinch zoom) di perangkat mobile
        document.addEventListener('touchstart', function(event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault(); // Mencegah double-tap zoom
            }
            lastTouchEnd = now;
        }, false);

        /* --- 3. LOGIKA BUKA UNDANGAN --- */
        const btnOpen = document.getElementById('btnOpen');
        const loader = document.getElementById('loader');
        const cover = document.getElementById('cover');
        const mainContent = document.getElementById('main-content');
        const bgm = document.getElementById('bgm');
        const musicBtn = document.getElementById('musicBtn');

        // Loader palsu agar terasa premium
        window.addEventListener('load', function() {
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 800);
            }, 2000);
        });

        btnOpen.addEventListener('click', function() {
            // Putar Musik
            bgm.play().catch(e => console.log("Audio play dipending sistem browser"));
            
            // Animasi Transisi Cover
            cover.style.transform = 'translateY(-100%)';
            
            // Aktifkan Konten Utama
            mainContent.classList.add('active');
            document.body.classList.remove('no-scroll');
            
            // Jalankan AOS (Animasi Scroll)
            setTimeout(() => {
                AOS.init({
                    duration: 1200,
                    once: true,
                    mirror: false
                });
                window.scrollTo(0, 0);
            }, 600);
        });

        /* --- 4. KONTROL MUSIK (PLAY/PAUSE) --- */
        let isPlaying = true;
        musicBtn.addEventListener('click', function() {
            if (isPlaying) {
                bgm.pause();
                this.innerHTML = '<i class="fas fa-pause"></i>';
                this.style.animation = 'none';
            } else {
                bgm.play();
                this.innerHTML = '<i class="fas fa-compact-disc fa-spin"></i>';
                this.style.animation = '';
            }
            isPlaying = !isPlaying;
        });

        /* --- 5. LOGIKA COUNTDOWN (HITUNG MUNDUR) --- */
        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = weddingDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

            if (distance < 0) {
                clearInterval(timer);
                document.getElementById("countdown").innerHTML = "ACARA SEDANG BERLANGSUNG";
            }
        }, 1000);

        /* --- 6. FUNGSI SALIN REKENING --- */
        function copyRek(id, btn) {
            const el = document.getElementById(id);
            const originalText = btn.innerHTML;
            
            navigator.clipboard.writeText(el.innerText).then(() => {
                btn.innerHTML = '<i class="fas fa-check"></i> BERHASIL';
                btn.style.background = 'var(--gold)';
                btn.style.color = '#000';
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = 'transparent';
                    btn.style.color = 'var(--gold)';
                }, 2000);
            }).catch(err => {
                alert("Gagal menyalin teks.");
            });
        }

        /* --- 7. LOGIKA RSVP (SIMULASI) --- */
        const rsvpForm = document.getElementById('weddingRsvp');
        rsvpForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('rsvp_name').value;
            const message = document.getElementById('rsvp_message').value;
            const attendance = document.querySelector('input[name="attendance"]:checked').value;
            
            // Efek loading tombol
            const submitBtn = this.querySelector('button');
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> MENGIRIM...';
            submitBtn.disabled = true;

            setTimeout(() => {
                // Tambahkan ke daftar komentar secara dinamis
                const list = document.getElementById('comment-list');
                const newItem = document.createElement('div');
                newItem.className = 'comment-item animate__animated animate__fadeIn';
                newItem.style.cssText = 'background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; border-left: 4px solid var(--gold); margin-bottom: 15px;';
                
                newItem.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <strong style="color: var(--gold);">${name}</strong>
                        <small style="font-size: 0.7rem; color: #777;"><i class="fas fa-check-circle"></i> ${attendance}</small>
                    </div>
                    <p style="font-size: 0.9rem; line-height: 1.5;">${message}</p>
                    <small style="display: block; margin-top: 10px; font-size: 0.65rem; color: #555;">Baru saja</small>
                `;
                
                list.prepend(newItem);
                
                // Reset Form
                rsvpForm.reset();
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> KIRIM UCAPAN';
                submitBtn.disabled = false;
                
                alert("Terima kasih " + name + ", konfirmasi Anda telah kami terima.");
            }, 1500);
        });
    </script>
