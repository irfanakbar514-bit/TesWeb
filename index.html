<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Irfan & Via Wedding</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link rel="stylesheet" href="style.css">

    <style>
        /* CSS Tambahan Biar Gak Kosong */
        .hidden { display: none !important; }
        #main-content { opacity: 0; }
        #main-content.show-now { 
            opacity: 1 !important; 
            display: block !important; 
        }
        body.no-scroll { overflow: hidden !important; height: 100vh; }
    </style>
</head>
<body class="no-scroll">

    <div id="loader" style="position:fixed; inset:0; background:#000; z-index:9999; display:flex; justify-content:center; align-items:center; color:#d4af37;">
        <div class="text-center">
            <i class="fas fa-spinner fa-spin fa-2x"></i>
            <p>Siapkan Baralek...</p>
        </div>
    </div>

    <section class="cover-section" id="cover" style="height:100vh; position:relative; z-index:100; background:#111; display:flex; align-items:center; justify-content:center; text-align:center;">
        <div class="content">
            <h1 class="font-cursive text-gold" style="font-size: 4rem;">Irfan & Via</h1>
            <p>Kepada Yth: <br><strong id="guestName">Tamu Undangan</strong></p>
            <button id="btnOpen" class="btn-open-undangan" style="margin-top:20px; padding:15px 30px; background:#d4af37; border:none; border-radius:50px; font-weight:bold; cursor:pointer;">
                <i class="fas fa-envelope-open"></i> Buka Undangan
            </button>
        </div>
    </section>

    <main id="main-content" class="hidden">
        <section class="hero-section" style="padding: 100px 20px; text-align:center;">
            <h2 data-aos="fade-up" class="font-cursive text-gold">Assalamu'alaikum</h2>
            <p data-aos="fade-up" data-aos-delay="200">Tanpa mengurangi rasa hormat, kami mengundang Anda...</p>
            </section>

        <footer style="padding:50px; text-align:center; background:#000;">
            <p>© 2026 Irfan & Via</p>
        </footer>
    </main>

    <audio id="weddingAudio" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mpeg">
    </audio>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        window.addEventListener('load', function() {
            const loader = document.getElementById('loader');
            if(loader) loader.style.display = 'none';
        });

        document.getElementById('btnOpen').addEventListener('click', function() {
            const main = document.getElementById('main-content');
            const cover = document.getElementById('cover');
            const audio = document.getElementById('weddingAudio');

            // PAKSA MUNCUL
            main.classList.remove('hidden');
            main.classList.add('show-now');
            document.body.classList.remove('no-scroll');
            document.body.style.overflow = 'auto';

            // MUSIK
            audio.play().catch(e => console.log("Izin audio"));

            // ANIMASI COVER HILANG
            cover.style.transition = '1s';
            cover.style.transform = 'translateY(-100%)';
            
            // REFRESH ANIMASI (Biar gak kosong)
            setTimeout(() => {
                cover.style.display = 'none';
                AOS.init({
                    duration: 1000,
                    once: true
                });
                // Paksa scroll ke atas sekali
                window.scrollTo(0, 0);
            }, 1000);
        });
    </script>
</body>
</html>
