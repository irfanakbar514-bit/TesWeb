<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Link Undangan</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .box { background: #222; padding: 25px; border-radius: 15px; border: 1px solid #d4af37; max-width: 400px; width: 100%; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #000; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #d4af37; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .hasil { margin-top: 15px; word-break: break-all; background: #000; padding: 10px; border-radius: 8px; font-size: 0.85rem; border: 1px solid #333; }
    </style>
</head>
<body>

<div class="box">
    <h3 style="color:#d4af37; margin-top:0;">Generator Link Undangan</h3>
    
    <label>Nama Tamu:</label>
    <input type="text" id="namaTamu" placeholder="Contoh: Budi & Keluarga">

    <label>Nomor WA Tamu (Opsional):</label>
    <input type="text" id="noWA" placeholder="Contoh: 628123456789">

    <button onclick="buatLink()">BUAT LINK UNDANGAN</button>

    <div id="output" style="display:none;">
        <p style="margin-bottom:5px; font-size:0.8rem; color:#aaa;">Link Undangan:</p>
        <div class="hasil" id="linkHasil"></div>
        <button onclick="salinLink()" style="background:#444; color:#fff;">Salin Link</button>
        <button onclick="kirimWA()" style="background:#25D366; color:#fff;">Kirim via WhatsApp</button>
    </div>
</div>

<script>
    const baseURL = "https://irfanakbar514-bit.github.io/TesWeb/";

    function buatLink() {
        const nama = document.getElementById('namaTamu').value.trim();
        if(!nama) { alert("Isi nama tamunya dulu bro!"); return; }

        const linkLengkap = baseURL + "?to=" + encodeURIComponent(nama);
        document.getElementById('linkHasil').innerText = linkLengkap;
        document.getElementById('output').style.display = 'block';
    }

    function salinLink() {
        const text = document.getElementById('linkHasil').innerText;
        navigator.clipboard.writeText(text);
        alert("Link berhasil disalin!");
    }

    function kirimWA() {
        const nama = document.getElementById('namaTamu').value.trim();
        const noWA = document.getElementById('noWA').value.trim();
        const link = document.getElementById('linkHasil').innerText;

        const pesan = `Kepada Yth. Bapak/Ibu/Saudara/i *${nama}*\n\n` +
                      `Tanpa mengurangi rasa hormat, perkenankan kami mengundang Bapak/Ibu/Saudara/i untuk menghadiri acara pernikahan kami.\n\n` +
                      `Berikut link undangan digital kami:\n${link}\n\n` +
                      `Merupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir dan memberikan doa restu.\n\n` +
                      `Terima Kasih.\n*Irfan & Afifah*`;

        let urlWA = "";
        if(noWA !== "") {
            urlWA = `https://api.whatsapp.com/send?phone=${noWA}&text=${encodeURIComponent(pesan)}`;
        } else {
            urlWA = `https://api.whatsapp.com/send?text=${encodeURIComponent(pesan)}`;
        }
        window.open(urlWA, '_blank');
    }
</script>

</body>
</html>
